name: FTP Debug - Marker File Test

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Look for personal-site remnants
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
        run: |
          set +e
          echo "=== httpdocs (current personal root) ==="
          curl -s --connect-timeout 10 --max-time 25 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/httpdocs/" 2>&1 | head -60

          echo ""
          echo "=== top-level dirs ==="
          curl -s --connect-timeout 10 --max-time 25 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1 | awk '/^d/ {print}' | head -40

          echo ""
          echo "=== search likely backup / old folders ==="
          for d in backup backups old private httpdocs.old git www public_html; do
            echo "-- $d --"
            curl -s --connect-timeout 10 --max-time 20 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/$d/" 2>&1 | head -15
          done

          echo ""
          echo "=== httpdocs index.html first lines ==="
          curl -s --connect-timeout 10 --max-time 20 -u "$FTP_USER:$FTP_PASS" -o /tmp/i.html "ftp://$FTP_HOST/httpdocs/index.html"
          head -20 /tmp/i.html
          echo "size=$(wc -c < /tmp/i.html)"
