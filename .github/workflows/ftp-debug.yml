name: FTP Debug - List Web Root Contents

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List FTP web root
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
        run: |
          echo "=== FTP ROOT (web root) FULL LISTING ==="
          curl -s --connect-timeout 10 --max-time 20 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1
          echo ""
          echo "=== CHECK OUR NEW FILES ==="
          for f in index.php resources.php about.php tools/maturity.php includes/header.php; do
            code=$(curl -s --connect-timeout 10 --max-time 15 -o /dev/null -w "%{http_code}" -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/$f" 2>&1)
            echo "$f -> $code"
          done