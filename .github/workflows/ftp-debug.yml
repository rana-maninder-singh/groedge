name: FTP Debug - List Directory Structure

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect FTP directory structure
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
        run: |
          which curl
          echo "=== FTP ROOT (/) ==="
          curl -s --connect-timeout 10 --max-time 30 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" || echo "FAILED ROOT"
          echo ""
          echo "=== /public_html ==="
          curl -s --connect-timeout 10 --max-time 30 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/public_html/" || echo "FAILED public_html"
          echo ""
          echo "=== /httpdocs ==="
          curl -s --connect-timeout 10 --max-time 30 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/httpdocs/" || echo "FAILED httpdocs"
          echo ""
          echo "=== /www ==="
          curl -s --connect-timeout 10 --max-time 30 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/www/" || echo "FAILED www"