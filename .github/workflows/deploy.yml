name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate PHP syntax (GroEdge)
        run: |
          sudo apt-get update && sudo apt-get install -y php-cli
          errors=0
          for f in $(find public_html -name "*.php"); do
            result=$(php -l "$f" 2>&1)
            if echo "$result" | grep -q "Parse error\|Fatal error"; then
              echo "ERROR: $f"
              echo "$result"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "$errors file(s) have syntax errors"
            exit 1
          fi
          echo "All PHP files pass syntax check"

      # Restore personal-site root redirect only (do NOT sync/wipe httpdocs —
      # the Learnings site lives there under /website/ from D:\projects\Learnings)
      - name: Restore ranamanindersingh.com root redirect
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
        run: |
          curl -s --connect-timeout 15 --max-time 30 \
            -u "$FTP_USER:$FTP_PASS" \
            -T ranamanindersingh/index.html \
            "ftp://$FTP_HOST/httpdocs/index.html"
          echo "Restored httpdocs/index.html → /website/ redirect"

      # GroEdge only: groedge.in → /groedge.in/
      - name: Deploy groedge.in
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASS }}
          server-dir: /groedge.in/
          local-dir: ./public_html/
          exclude: |
            *.zip
            *.log
            .git*

      - name: Remove legacy HTML on groedge.in
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
        run: |
          set +e
          for FILE in index.html about.html; do
            curl -s --connect-timeout 10 --max-time 20 -u "$FTP_USER:$FTP_PASS" -Q "-DELE $FILE" "ftp://$FTP_HOST/groedge.in/"
          done
          echo "Legacy HTML cleanup done"
