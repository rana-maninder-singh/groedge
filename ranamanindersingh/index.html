<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Data &amp; Analytics Lab</title>
  <script>
    (function () {
      var h = window.location.hash;
      if (!h || h === "#") h = "#home";
      window.location.replace("/website/" + h);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=/website/#home" />
  </noscript>
</head>
<body>
  <p>Redirecting to the <a id="lab-link" href="/website/#home">learning lab</a>…</p>
  <script>
    (function () {
      var h = window.location.hash;
      if (!h || h === "#") h = "#home";
      var a = document.getElementById("lab-link");
      if (a) a.setAttribute("href", "/website/" + h);
    })();
  </script>
</body>
</html>
