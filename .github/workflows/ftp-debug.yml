name: FTP Debug - Marker File Test

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm domain document roots
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
        run: |
          set +e
          TS=$(date +%s)
          MARKER="grdg-probe-${TS}.txt"
          echo "PleskProbeOK-$MARKER" > /tmp/$MARKER

          # Likely addon domain folder names (may be secret-masked in logs)
          CANDIDATES=(
            "httpdocs"
            "public_html"
            "groedge.in"
            "www.groedge.in"
            "ranamanindersingh.com"
            "www.ranamanindersingh.com"
            "groedge"
          )

          for DIR in "${CANDIDATES[@]}"; do
            echo ""
            echo "=== TRY $DIR ==="
            curl -s --connect-timeout 10 --max-time 25 -u "$FTP_USER:$FTP_PASS" -T /tmp/$MARKER "ftp://$FTP_HOST/$DIR/$MARKER"
            echo "upload_exit=$?"

            for HOST in "https://groedge.in" "https://ranamanindersingh.com"; do
              HTTP=$(curl -sk --connect-timeout 10 --max-time 15 -o /tmp/body -w "%{http_code}" "$HOST/$MARKER")
              HIT="no"
              if [ "$HTTP" = "200" ] && grep -q "PleskProbeOK" /tmp/body 2>/dev/null; then HIT="YES"; fi
              echo "$HOST <- /$DIR/ => HTTP $HTTP hit=$HIT"
            done

            curl -s --connect-timeout 10 --max-time 20 -u "$FTP_USER:$FTP_PASS" -o /tmp/s.css "ftp://$FTP_HOST/$DIR/style.css"
            echo "/$DIR/style.css bytes=$(wc -c < /tmp/s.css 2>/dev/null || echo 0)"

            curl -s --connect-timeout 10 --max-time 20 -u "$FTP_USER:$FTP_PASS" -Q "-DELE $MARKER" "ftp://$FTP_HOST/$DIR/" >/dev/null 2>&1 || true
          done
