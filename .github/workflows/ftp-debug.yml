name: FTP Debug - Marker File Test

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect personal site entry points
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
        run: |
          set +e
          echo "=== httpdocs/website/ ==="
          curl -s --connect-timeout 10 --max-time 25 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/httpdocs/website/" 2>&1 | head -40

          echo ""
          echo "=== index.html.old ==="
          curl -s --connect-timeout 10 --max-time 20 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/httpdocs/index.html.old" | head -40

          echo ""
          echo "=== website/index.html head ==="
          curl -s --connect-timeout 10 --max-time 20 -u "$FTP_USER:$FTP_PASS" -o /tmp/w.html "ftp://$FTP_HOST/httpdocs/website/index.html"
          echo "size=$(wc -c < /tmp/w.html)"
          head -40 /tmp/w.html

          echo ""
          echo "=== package.json ==="
          curl -s --connect-timeout 10 --max-time 20 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/httpdocs/package.json"

          echo ""
          echo "=== README.md head ==="
          curl -s --connect-timeout 10 --max-time 20 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/httpdocs/README.md" | head -40
