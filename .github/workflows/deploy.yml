name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate PHP syntax
        run: |
          sudo apt-get update && sudo apt-get install -y php-cli
          errors=0
          for f in $(find public_html -name "*.php"); do
            result=$(php -l "$f" 2>&1)
            if echo "$result" | grep -q "Parse error\|Fatal error"; then
              echo "ERROR: $f"
              echo "$result"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "$errors file(s) have syntax errors"
            exit 1
          fi
          echo "All PHP files pass syntax check"

      # Primary domain: ranamanindersingh.com → /httpdocs/
      - name: Deploy to ranamanindersingh.com (httpdocs)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASS }}
          server-dir: /httpdocs/
          local-dir: ./public_html/
          exclude: |
            *.zip
            *.log
            .git*

      # Addon domain: groedge.in → /groedge.in/
      - name: Deploy to groedge.in
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASS }}
          server-dir: /groedge.in/
          local-dir: ./public_html/
          exclude: |
            *.zip
            *.log
            .git*
