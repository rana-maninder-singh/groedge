name: FTP Debug - Marker File Test

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Upload marker file and test live fetch
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
        run: |
          MARKER="grdg-probe-$(date +%s).txt"
          echo "PleskProbeOK-$MARKER" > /tmp/$MARKER
          echo "=== UPLOAD $MARKER to FTP root ==="
          curl -s --connect-timeout 10 --max-time 20 -u "$FTP_USER:$FTP_PASS" -T /tmp/$MARKER "ftp://$FTP_HOST/$MARKER" 2>&1
          echo "upload exit: $?"
          echo ""
          echo "=== VERIFY LISTING shows it ==="
          curl -s --connect-timeout 10 --max-time 20 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1 | grep "$MARKER"
          echo ""
          echo "=== TRY FETCH FROM LIVE SITE ==="
          HTTP=$(curl -sk --connect-timeout 10 --max-time 20 -o /dev/null -w "%{http_code}" "https://groedge.in/$MARKER" 2>&1)
          echo "https://groedge.in/$MARKER -> HTTP $HTTP"
          if [ "$HTTP" = "200" ]; then
            echo "SUCCESS: FTP root == LIVE web root"
            curl -sk --connect-timeout 10 --max-time 20 "https://groedge.in/$MARKER" 2>&1
          else
            echo "MISMATCH: FTP root is NOT the live web root"
            echo "Also probing DNS IPs:"
            getent hosts groedge.in | awk '{print $1}'
          fi
          echo ""
          echo "=== CLEANUP ==="
          curl -s --connect-timeout 10 --max-time 20 -u "$FTP_USER:$FTP_PASS" -X 'DELE' "ftp://$FTP_HOST/$MARKER" 2>&1 || curl -s --connect-timeout 10 --max-time 20 -u "$FTP_USER:$FTP_PASS" -Q "-DELE $MARKER" "ftp://$FTP_HOST/" 2>&1
          echo "cleanup attempted"