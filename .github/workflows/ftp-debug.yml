name: FTP Debug - Test httpdocs Access

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Test httpdocs access
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
        run: |
          echo "=== VERBOSE LIST httpdocs ==="
          curl -v --connect-timeout 10 --max-time 25 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/httpdocs/" 2>&1 | tail -30
          echo ""
          echo "=== UPLOAD TEST FILE to httpdocs ==="
          echo "test-$RANDOM" > /tmp/probe.txt
          curl -v --connect-timeout 10 --max-time 25 -u "$FTP_USER:$FTP_PASS" -T /tmp/probe.txt "ftp://$FTP_HOST/httpdocs/probe.txt" 2>&1 | tail -15
          echo ""
          echo "=== LIST ACCOUNT HOME TOP LEVEL ==="
          curl -s --connect-timeout 10 --max-time 25 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1
          echo ""
          echo "=== SEARCH FOR WEB ROOT: /var/www/vhosts (if accessible) ==="
          curl -s --connect-timeout 10 --max-time 25 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/httpdocs/index.php" 2>&1 | head -5 || echo "no index.php entry"